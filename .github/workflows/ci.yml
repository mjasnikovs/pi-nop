name: CI

on:
    push:
    pull_request:

# A push and the pull request it updates share one run.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            # On Windows, bun 1.3 never fires an unref'd timer inside bun test, and the run hangs.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.5
            # The lowest Node pi supports, so a newer-only API fails here first.
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.19.0
            # apt and choco ship a poppler too old for -remove-hyphens; conda-forge has one version on all three.
            - uses: mamba-org/setup-micromamba@v3
              with:
                  environment-name: poppler
                  create-args: -c conda-forge poppler=26.11.0
                  cache-environment: true
            - name: Put pdftotext on PATH
              shell: bash
              run: |
                  prefix="$MAMBA_ROOT_PREFIX/envs/poppler"
                  if [ "$RUNNER_OS" = Windows ]; then echo "$prefix/Library/bin"; else echo "$prefix/bin"; fi >> "$GITHUB_PATH"
            - run: pdftotext -v
            - run: bun install --frozen-lockfile
            - run: bun run lint:check
            - run: bun run test
            - run: node test/node/docs-smoke.mjs
