name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            # On Windows, bun 1.3 never fires an unref'd timer inside bun test, and the run hangs.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.5
            # The lowest Node pi supports, so a newer-only API fails here first.
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.19.0
            - run: bun install --frozen-lockfile
            - run: bun run lint:check
            - run: bun run test
            - run: node test/node/docs-smoke.mjs
            - run: node test/node/pdf-smoke.mjs
