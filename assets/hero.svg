<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, 'Liberation Sans', Arial, sans-serif" role="img" aria-label="pi-nop. The main agent sends a task to a subagent. The subagent reads repo files, a web page or npm package docs in its own session and sends back only the answer. /plan goes from goal to questions to steps, then the main agent builds it.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d4dd"/><stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="url(#bg)"/>

  <g transform="translate(44,34) scale(0.82)" fill="none" stroke="#56d4dd" stroke-width="2.56" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30.18 4.98A20 20 0 1 0 41.66 14.61"/>
    <path d="M13.5 17H34.5M19.5 17V32M28.5 17V32"/>
  </g>
  <text x="90" y="63" font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">pi-nop</text>

  <text x="44" y="160" font-size="50" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Subagents read.</text>
  <text x="44" y="220" font-size="50" font-weight="700" fill="url(#hl)" letter-spacing="-1.5">Main context gets</text>
  <text x="44" y="280" font-size="50" font-weight="700" fill="url(#hl)" letter-spacing="-1.5">the answer.</text>
  <rect x="44" y="306" width="72" height="4" rx="2" fill="#2f81f7"/>
  <text x="44" y="346" font-size="17" fill="#8b949e">Files, pages and docs are read</text>
  <text x="44" y="371" font-size="17" fill="#8b949e">in a separate session.</text>

  <!-- main agent and subagent -->
  <rect x="490" y="138" width="110" height="84" rx="14" fill="#161b22" stroke="#e6edf3" stroke-opacity="0.35" stroke-width="1.2"/>
  <text x="545" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">MAIN</text>
  <text x="545" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">AGENT</text>

  <rect x="676" y="138" width="110" height="84" rx="14" fill="#0d2440" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="731" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">SUBAGENT</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.6">
    <path d="M604 162H670" marker-end="url(#arrow)"/>
    <path d="M672 200H606" marker-end="url(#arrow)" stroke="#56d4dd"/>
  </g>
  <text x="638" y="154" text-anchor="middle" font-size="10.5" fill="#8b949e">task</text>
  <text x="638" y="216" text-anchor="middle" font-size="10.5" fill="#56d4dd">answer</text>

  <!-- what it reads -->
  <g fill="none" stroke="#6e7681" stroke-width="1.3">
    <path d="M786 180C800 180 800 116 818 116"/>
    <path d="M786 180H818"/>
    <path d="M786 180C800 180 800 244 818 244"/>
  </g>
  <g font-size="12" font-weight="700" fill="#e6edf3">
    <rect x="818" y="94" width="112" height="44" rx="10" fill="#0f2a1b" stroke="#3fb950" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="830" y="113">Repo files</text>
    <rect x="818" y="158" width="112" height="44" rx="10" fill="#2d2410" stroke="#d29922" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="830" y="177">Web page</text>
    <rect x="818" y="222" width="112" height="44" rx="10" fill="#33172a" stroke="#f778ba" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="830" y="241">npm package</text>
  </g>
  <g font-size="10" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="830" y="128">subagent</text>
    <text x="830" y="192">subagent-fetch</text>
    <text x="830" y="256">subagent-docs</text>
  </g>

  <!-- /plan -->
  <text x="490" y="318" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/plan</text>
  <g font-size="12" font-weight="700" fill="#e6edf3" text-anchor="middle">
    <rect x="490" y="332" width="82" height="34" rx="17" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="531" y="353">Goal</text>
    <rect x="596" y="332" width="96" height="34" rx="17" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="644" y="353">Questions</text>
    <rect x="716" y="332" width="82" height="34" rx="17" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="757" y="353">Steps</text>
    <rect x="822" y="332" width="108" height="34" rx="17" fill="#161b22" stroke="#e6edf3" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="876" y="353">Main agent</text>
  </g>
  <g fill="none" stroke="#8b949e" stroke-width="1.6">
    <path d="M575 349H592" marker-end="url(#arrow)"/>
    <path d="M695 349H712" marker-end="url(#arrow)"/>
    <path d="M801 349H818" marker-end="url(#arrow)"/>
  </g>
</svg>
