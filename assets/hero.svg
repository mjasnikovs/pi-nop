  <text x="90" y="63" font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">pi-nop</text>
  <text x="44" y="186" font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-2">Read-only</text>
  <text x="44" y="254" font-size="62" font-weight="700" fill="url(#hl)" letter-spacing="-2">Local AI</text>
  <text x="44" y="322" font-size="62" font-weight="700" fill="url(#hl)" letter-spacing="-2">Subagents.</text>
  <rect x="44" y="354" width="72" height="4" rx="2" fill="#8957e5"/>
  <text x="44" y="398" font-size="17" fill="#8b949e">Subagents read in their own session.</text>
  <text x="44" y="423" font-size="17" fill="#8b949e">Only the answer reaches the main</text>
  <text x="44" y="448" font-size="17" fill="#8b949e">context, so it stays small.</text>
  <rect x="470.0" y="132" width="74" height="74" rx="16.3" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.28" stroke-width="1.2"/>
  <g transform="translate(489.0,151.0) scale(1.5)" fill="none" stroke="#a371f7" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h7"/><path d="M4 4h5l2 2h9v4"/><path d="M4 4v16"/><circle cx="16" cy="15" r="4"/><path d="M21 20l-2.2-2.2"/></g>
  <text x="507.0" y="227" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3" letter-spacing="0.4">SUBAGENT</text>
  <text x="507.0" y="245" text-anchor="middle" font-size="9.5" fill="#8b949e">Reads code across</text>
  <text x="507.0" y="257" text-anchor="middle" font-size="9.5" fill="#8b949e">many files, returns</text>
  <text x="507.0" y="269" text-anchor="middle" font-size="9.5" fill="#8b949e">the conclusion</text>
  <rect x="563.0" y="132" width="74" height="74" rx="16.3" fill="#0d2440" stroke="#58a6ff" stroke-opacity="0.28" stroke-width="1.2"/>
  <g transform="translate(582.0,151.0) scale(1.5)" fill="none" stroke="#58a6ff" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5a14.5 14.5 0 0 1 0 19a14.5 14.5 0 0 1 0-19z"/></g>
  <text x="600.0" y="227" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3" letter-spacing="0.4">FETCH</text>
  <text x="600.0" y="245" text-anchor="middle" font-size="9.5" fill="#8b949e">Reads one web</text>
  <text x="600.0" y="257" text-anchor="middle" font-size="9.5" fill="#8b949e">page, returns what</text>
  <text x="600.0" y="269" text-anchor="middle" font-size="9.5" fill="#8b949e">the query asks</text>
  <rect x="656.0" y="132" width="74" height="74" rx="16.3" fill="#33172a" stroke="#f778ba" stroke-opacity="0.28" stroke-width="1.2"/>
  <g transform="translate(675.0,151.0) scale(1.5)" fill="none" stroke="#f778ba" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5"/><path d="M12 12v9"/></g>
  <text x="693.0" y="227" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3" letter-spacing="0.4">DOCS</text>
  <text x="693.0" y="245" text-anchor="middle" font-size="9.5" fill="#8b949e">Answers from an</text>
  <text x="693.0" y="257" text-anchor="middle" font-size="9.5" fill="#8b949e">npm package's</text>
  <text x="693.0" y="269" text-anchor="middle" font-size="9.5" fill="#8b949e">types and README</text>
  <rect x="749.0" y="132" width="74" height="74" rx="16.3" fill="#0f2a1b" stroke="#3fb950" stroke-opacity="0.28" stroke-width="1.2"/>
  <g transform="translate(768.0,151.0) scale(1.5)" fill="none" stroke="#3fb950" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></g>
  <text x="786.0" y="227" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3" letter-spacing="0.4">SEARCH</text>
  <text x="786.0" y="245" text-anchor="middle" font-size="9.5" fill="#8b949e">Searches the</text>
  <text x="786.0" y="257" text-anchor="middle" font-size="9.5" fill="#8b949e">live web, up to</text>
  <text x="786.0" y="269" text-anchor="middle" font-size="9.5" fill="#8b949e">10 results</text>
  <rect x="842.0" y="132" width="74" height="74" rx="16.3" fill="#2d2410" stroke="#d29922" stroke-opacity="0.28" stroke-width="1.2"/>
  <g transform="translate(861.0,151.0) scale(1.5)" fill="none" stroke="#d29922" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h11M10 12h11M10 18h11"/><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/></g>
  <text x="879.0" y="227" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e6edf3" letter-spacing="0.4">/PLAN</text>
  <text x="879.0" y="245" text-anchor="middle" font-size="9.5" fill="#8b949e">Goal, questions,</text>
  <text x="879.0" y="257" text-anchor="middle" font-size="9.5" fill="#8b949e">steps, then the</text>
  <text x="879.0" y="269" text-anchor="middle" font-size="9.5" fill="#8b949e">main agent builds</text>
</svg>
