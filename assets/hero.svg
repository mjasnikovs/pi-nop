<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, 'Liberation Sans', Arial, sans-serif" role="img" aria-label="pi-nop. Read-only subagents for pi. Four tools search the repo, read a web page, read an npm package and search the web. The /plan panel goes from goal to questions to steps, then hands the plan to the main agent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d4dd"/><stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <g transform="translate(44,34) scale(0.82)" fill="none" stroke="#56d4dd" stroke-width="2.56" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30.18 4.98A20 20 0 1 0 41.66 14.61"/>
    <path d="M13.5 17H34.5M19.5 17V32M28.5 17V32"/>
  </g>
  <text x="90" y="63" font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">pi-nop</text>

  <g transform="translate(0,90)">
  <text x="44" y="170" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-2">Read-only</text>
  <text x="44" y="234" font-size="58" font-weight="700" fill="url(#hl)" letter-spacing="-2">subagents</text>
  <text x="44" y="298" font-size="58" font-weight="700" fill="url(#hl)" letter-spacing="-2">for pi.</text>
  <rect x="44" y="328" width="72" height="4" rx="2" fill="#2f81f7"/>
  <text x="44" y="370" font-size="17" fill="#8b949e">The digging runs in a child session.</text>
  <text x="44" y="395" font-size="17" fill="#8b949e">The main context gets only the answer.</text>

  <text x="470" y="110" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="1.5">TOOLS</text>
  <g font-size="11.5" font-weight="700" fill="#e6edf3" letter-spacing="0.4" text-anchor="middle">
    <rect x="470" y="124" width="104" height="74" rx="14" fill="#0d2440" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="522" y="156">SUBAGENT</text>
    <rect x="586" y="124" width="104" height="74" rx="14" fill="#0f2a1b" stroke="#3fb950" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="638" y="156">FETCH</text>
    <rect x="702" y="124" width="104" height="74" rx="14" fill="#2d2410" stroke="#d29922" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="754" y="156">DOCS</text>
    <rect x="818" y="124" width="104" height="74" rx="14" fill="#33172a" stroke="#f778ba" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="870" y="156">SEARCH</text>
  </g>
  <g font-size="9.5" fill="#8b949e" text-anchor="middle">
    <text x="522" y="176">Search the repo</text>
    <text x="638" y="176">Read a</text>
    <text x="638" y="188">web page</text>
    <text x="754" y="176">Read an npm</text>
    <text x="754" y="188">package</text>
    <text x="870" y="176">Find pages</text>
    <text x="870" y="188">on the web</text>
  </g>

  <text x="470" y="270" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="1.5">/PLAN</text>
  <g font-size="11.5" font-weight="700" fill="#e6edf3" letter-spacing="0.4" text-anchor="middle">
    <rect x="470" y="284" width="92" height="74" rx="14" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="516" y="316">GOAL</text>
    <rect x="592" y="284" width="92" height="74" rx="14" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="638" y="316">QUESTIONS</text>
    <rect x="714" y="284" width="92" height="74" rx="14" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="760" y="316">STEPS</text>
    <rect x="836" y="284" width="92" height="74" rx="14" fill="#1e1633" stroke="#a371f7" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="882" y="316">HAND OVER</text>
  </g>
  <g font-size="9.5" fill="#8b949e" text-anchor="middle">
    <text x="516" y="336">What done</text>
    <text x="516" y="348">looks like</text>
    <text x="638" y="336">One at a time,</text>
    <text x="638" y="348">you answer</text>
    <text x="760" y="336">Steps, files</text>
    <text x="760" y="348">and tests</text>
    <text x="882" y="336">Main agent</text>
    <text x="882" y="348">builds, tracked</text>
  </g>
  <g fill="none" stroke="#6e7681" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M566 321h20M580 316l6 5-6 5"/>
    <path d="M688 321h20M702 316l6 5-6 5"/>
    <path d="M810 321h20M824 316l6 5-6 5"/>
  </g>
  </g>
</svg>
